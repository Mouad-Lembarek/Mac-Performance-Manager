name: Bug report
description: Something is wrong, misleading or unsafe
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. mpm --work\n2. ..."
  - type: input
    id: mac
    attributes:
      label: Mac model, chip and RAM
      placeholder: "MacBook Air M2, 8 GB"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and mpm version
      placeholder: "macOS 15.1, mac-performance-manager 1.0.0 (mpm --version)"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `mpm --once`
      description: Process names only; remove anything you consider private.
      render: text
